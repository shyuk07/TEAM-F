# 모노레포 이전(backend/) 전의 프로젝트 이름을 유지해 기존 DB 볼륨(team-f-backend_postgres_data)을 계속 쓴다
name: team-f-backend

services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: lastcall
      POSTGRES_PASSWORD: lastcall_dev
      POSTGRES_DB: lastcall

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastcall -d lastcall"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: