[project]
name = "last-call"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "imeab", email = "qodbals18@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "jinja2>=3.1.6",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.14.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
last-call = "last_call:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
